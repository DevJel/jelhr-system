<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png"><title>Offboarding · JelHR</title><link rel="stylesheet" href="css/app.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">JH</div><div><div class="brand-text">JelHR</div><div class="brand-sub">System</div></div></div><nav class="nav"><a href="index.html">⌂　Dashboard</a><a href="employees.html">♙　Employees</a><a href="onboarding.html">☑　Onboarding</a><a class="active" href="offboarding.html">⇥　Offboarding</a><a href="security.html">◇　Security</a></nav><div class="sidebar-footer"><div class="user-chip"><div class="user-avatar">HR</div><div class="user-meta"><div class="name" id="userName">Loading…</div><div class="role" id="userRole">Authenticated</div></div></div><button class="btn btn-light" id="logout" style="width:100%;justify-content:center;margin-top:10px">Sign out</button></div></aside><main class="main"><div class="page-header"><div><h1>Employee <em>offboarding</em></h1><p>Coordinate knowledge transfer, access removal, assets, finance and final closure.</p></div></div><section class="card" style="margin-bottom:16px"><h3>Start an offboarding case</h3><form id="startForm" class="grid grid-3"><label>Employee<select name="employeeId" id="employeeSelect" required><option value="">Loading employees…</option></select></label><label>Last working day<input name="lastWorkingDay" type="date" required></label><label>Reason<select name="reason" required><option value="">Select reason</option><option>Resignation</option><option>End of contract</option><option>Retirement</option><option>Involuntary separation</option><option>Other</option></select></label><button class="btn btn-dark" type="submit">Create offboarding case</button></form><p id="formMessage" style="font-size:12px;color:#747c89"></p></section><section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h3>Offboarding cases</h3><button class="btn btn-light" id="refresh">Refresh</button></div><div id="cases" class="empty">Loading cases…</div></section></main></div><script>
const $=s=>document.querySelector(s),api=async(url,opts={})=>{const r=await fetch(url,{credentials:"same-origin",...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d};
(async()=>{try{const m=await api("/api/bff/auth/navigation");$("#userName").textContent=m.user.displayName;$("#userRole").textContent=m.user.role;await load()}catch{location.replace("login.html")}})();
$("#logout").onclick=async()=>{await api("/api/bff/auth/logout",{method:"POST"});location.replace("login.html")};
$("#refresh").onclick=load;
$("#startForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await api("/api/bff/offboarding",{method:"POST",body:JSON.stringify({employeeId:f.get("employeeId"),lastWorkingDay:f.get("lastWorkingDay"),reason:f.get("reason")})});$("#formMessage").textContent="Case created with "+d.taskCount+" checklist tasks.";e.target.reset();load()}catch(x){$("#formMessage").textContent=x.message}};
async function load(){try{const em=await api("/api/bff/employees");document.querySelector("#employeeSelect").innerHTML='<option value="">Select employee</option>'+em.employees.map(e=>'<option value="'+esc(e.id)+'">'+esc(e.employee_number+" · "+e.first_name+" "+e.last_name+" · "+e.employment_status)+'</option>').join("");const d=await api("/api/bff/offboarding");$("#cases").innerHTML=d.cases.length?d.cases.map(c=>'<article style="padding:14px 0;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><strong>'+esc(c.first_name+" "+c.last_name)+'</strong><span class="badge badge-yellow">'+esc(c.status)+'</span></div><div style="font-size:12px;color:var(--muted);margin-top:5px">'+esc(c.employee_number)+' · '+esc(c.reason)+' · Last day '+esc(c.last_working_day)+'</div><button class="btn btn-light" style="margin-top:10px" onclick="openCase(\''+esc(c.id)+'\')">View checklist</button></article>').join(""):'<div class="empty">No offboarding cases yet.</div>'}catch(e){$("#cases").textContent=e.message}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
window.openCase=async id=>{try{const d=await api("/api/bff/offboarding/"+id);const lines=d.tasks.map(t=>t.title+" — "+t.status).join("\n");const chosen=prompt("Case checklist:\n"+lines+"\n\nEnter task ID to update, or Cancel.");if(!chosen)return;const t=d.tasks.find(x=>x.id===chosen);if(!t){alert("Use the exact task ID from the checklist API.");return}const status=prompt("Status: pending, in_progress, completed, blocked, not_applicable",t.status);if(status)await api("/api/bff/offboarding/"+id,{method:"PATCH",body:JSON.stringify({taskId:t.id,status})});load()}catch(e){alert(e.message)}};
</script></body></html>
