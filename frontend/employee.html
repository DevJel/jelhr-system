<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png"><title>My workspace · JelHR</title><link rel="stylesheet" href="css/app.css"></head><body><main class="main" style="max-width:920px;margin:auto"><header class="page-header"><div><div class="brand"><div class="brand-mark">JH</div><div><div class="brand-text">JelHR</div><div class="brand-sub">Employee workspace</div></div></div><h1 style="margin-top:35px">My <em>workspace</em></h1><p>Personal HR information and assigned tasks.</p></div><button class="btn btn-dark" id="logout">Sign out</button></header><section class="grid grid-2"><article class="card"><h3>My profile</h3><p id="profile">Loading your account…</p></article><article class="card"><h3>Access scope</h3><p style="color:var(--muted);font-size:13px;line-height:1.6">You can access your own employee workspace. HR administration, other employee records, and offboarding controls are not available from this account.</p></article></section></main><script>fetch('/api/bff/auth/me',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>document.querySelector('#profile').textContent=d.displayName+' · '+d.email).catch(()=>location.replace('login.html'));document.querySelector('#logout').onclick=async()=>{await fetch('/api/bff/auth/logout',{method:'POST'});location.replace('login.html')};</script></body></html>
