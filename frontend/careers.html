<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Careers · JelHR</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/css/v04.css"><meta name="robots" content="noindex,nofollow"></head><body class="v04"><main class="v-public"><header class="v-publichead"><a class="v-brand" href="/careers.html">JelHR <span>CAREERS</span></a><p class="v-eyebrow" id="brandTag">CAREERS</p><h1 id="brandName">Find your next opportunity.</h1><p class="v-sub" id="brandIntro">Explore open roles and apply to join the team.</p></header><section id="jobList" class="v-grid"></section><section id="applyPanel" class="v-card v-formcard v-hidden"><button class="v-btn light" id="backJobs">← All roles</button><h2 id="applyTitle">Apply for this role</h2><form id="applyForm"><div class="v-grid" style="grid-template-columns:1fr 1fr"><div class="v-field"><label class="v-label">First name</label><input class="v-input" name="firstName" required maxlength="80"></div><div class="v-field"><label class="v-label">Last name</label><input class="v-input" name="lastName" required maxlength="80"></div></div><div class="v-field"><label class="v-label">Email</label><input class="v-input" name="email" type="email" required></div><div class="v-field"><label class="v-label">Phone</label><input class="v-input" name="phone"></div><div class="v-field"><label class="v-label">Location</label><input class="v-input" name="location"></div><div class="v-field"><label class="v-label">Profile link</label><input class="v-input" name="profileUrl" type="url" placeholder="https://…"></div><div class="v-field"><label class="v-label">Cover letter</label><textarea class="v-textarea" name="coverLetter" rows="4"></textarea></div><div class="v-field"><label class="v-label">Résumé (PDF, Word or TXT)</label><input class="v-input" name="resume" type="file" accept=".pdf,.doc,.docx,.txt" required></div><div class="v-field"><label><input type="
