<body class="auth-page"><main class="auth-frame"><section class="auth-content"><a class="wordmark" href="login.html">JelHR <span>PEOPLE OPERATIONS</span></a><div class="auth-center"><h1>Welcome back</h1><p class="intro">Sign in to your workspace</p><form id="loginForm"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" placeholder="Your work email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="Enter your password" required><button type="submit" id="submitBtn">Sign in</button><div class="auth-error" id="error" role="alert" aria-live="polite"></div></form></div><p class="auth-foot">Access is assigned by your organization. Never share your password.</p></section><aside class="auth-visual" style="--team-image:url('/login-team.jpg')" aria-label="Colleagues collaborating in an office"><div class="visual-label"><span class="dot"></span> BETTER TOGETHER<br><strong>People make the difference.</strong></div><div class="visual-card"><span class="dot"></span><strong>A little more human, every day.</strong><small>Everything your people need, in one place.</small></div></aside></main><script src="js/login.js"></script></body></html>
