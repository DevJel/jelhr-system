<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="icon" type="image/png" href="/favicon.png"><title>Sign in · JelHR</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/hashbyt-design.css"></head>
<body class="jh-login"><main class="login-card" aria-labelledby="stepTitle">
<a class="brand login-brand" href="/login.html"><span class="brand-mark" aria-hidden="true">J</span><span>JelHR</span></a>
<h1 id="stepTitle">Sign in</h1><p class="login-intro" id="stepIntro">Sign in to your workspace</p>
<form id="loginForm" novalidate><div id="credentialsStep">
<label for="identifier">Email, username or employee ID</label><input id="identifier" name="identifier" autocomplete="username" maxlength="254" placeholder="Enter your work email or username" required>
<div class="label-row"><label for="password">Password</label><button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" aria-pressed="false">Show</button></div><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="Enter your password" required>
<label for="workspace">Workspace ID or company domain <span class="muted">(optional)</span></label><input id="workspace" name="workspace" autocomplete="organization" maxlength="120" placeholder="Workspace slug">
<div class="turnstile-wrap"><div id="turnstileWidget"></div></div><button type="submit" class="primary full" id="submitBtn" disabled>Loading security check…</button>
<a id="ssoLink" class="secondary full" href="#" hidden>Sign in with single sign-on</a><button type="button" class="secondary full" id="passkeyBtn">Sign in with a passkey</button>
</div><div class="auth-step" id="otpStep" hidden><p id="otpHint">Complete verification to continue.</p><label for="mfaMethod">Verification method</label><select id="mfaMethod" name="mfaMethod"><option value="email_otp">Email code</option><option value="totp">Authenticator app</option><option value="passkey">Passkey</option></select><label for="otpCode" id="otpLabel">Six-digit code</label><input id="otpCode" name="otpCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="Enter 6-digit code"><button type="button" class="primary full" id="verifyOtpBtn">Verify and sign in</button><button type="button" class="secondary full" id="backBtn">Back to sign in</button></div>
<p class="auth-error" id="error" role="alert" aria-live="polite"></p></form><p class="login-foot">Access is assigned by your organization. Never share your password.</p></main><script src="/js/login.js"></script><script src="/js/login-design.js"></script></body></html>
