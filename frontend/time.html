<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.png"><title>Time tracking · JelHR</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/v04.css"><link rel="stylesheet" href="/css/workflows.css"></head><body class="v04 workflow"><main class="v-shell"><header class="v-top"><a class="v-brand" href="/index.html">JelHR <span>PEOPLE OPERATIONS</span></a><nav class="v-nav" aria-label="Workspace navigation"><a id="homeLink" href="/index.html">Dashboard</a><a href="/time.html" aria-current="page">Time</a><a href="/onboarding.html" data-feature="onboarding">Onboarding</a></nav><button type="button" class="v-btn light" id="logout">Log out</button></header><div class="v-head"><div><p class="v-eyebrow">YOUR WORKDAY</p><h1>Time tracking</h1><p class="v-sub">Record work time and review timesheets.</p></div></div><p id="message" hidden></p><div class="v-grid workflow-grid" hidden><section class="v-card" aria-labelledby="clockTitle"><h2 id="clockTitle">Time clock</h2><p id="clockState" aria-live="polite">Loading…</p><form id="clockForm" hidden><div class="v-field"><label class="v-label" for="note">Note (optional)</label><input id="note" class="v-input" maxlength="300"></div><div class="v-field" id="breakField" hidden><label class="v-label" for="breakMinutes">Break in minutes</label><input id="breakMinutes" class="v-input" type="number" min="0" max="1440" value="0"></div><button class="v-btn primary" id="clockButton" type="submit">Clock in</button></form></section><section class="v-card" aria-labelledby="entriesTitle"><h2 id="entriesTitle">Timesheets</h2><form id="filterForm" class="filters"><div class="v-field" id="scopeField" hidden><label class="v-label" for="scope">Scope</label><select id="scope" class="v-select"><option value="mine">My entries</option><option value="team">Team entries</option></select></div><div class="v-field"><label class="v-label" for="from">From (UTC)</label><input id="from" class="v-input" type="date"></div><div class="v-field"><label class="v-label" for="to">Through (UTC)</label><input id="to" class="v-input" type="date"></div><button type="submit" class="v-btn light">Apply filters</button></form><p class="v-muted">Dates filter entry start times in UTC. If From is blank, the last 30 days are shown. Up to 1,000 entries are shown.</p><div id="entries" aria-live="polite">Loading…</div></section></div><section class="v-card edit-card" id="editSection" hidden><h2>Edit pending entry</h2><form id="editForm"><div class="v-field"><label for="editNote" class="v-label">Note</label><input id="editNote" class="v-input" maxlength="300"></div><div class="v-field"><label for="editBreak" class="v-label">Break in minutes</label><input id="editBreak" class="v-input" type="number" min="0" max="1440" required></div><button class="v-btn primary" type="submit">Save changes</button> <button type="button" class="v-btn light" id="editCancel">Cancel</button></form></section></main><script src="/js/v04.js"></script><script src="/js/workflow.js"></script><script src="/js/time.js"></script></body></html>
