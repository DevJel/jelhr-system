<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accept invitation · JelHR</title><link rel="stylesheet" href="/css/v04.css"></head><body class="v04"><main class="v-public"><section class="v-card v-login"><a class="v-brand" href="/login.html">JelHR <span>WORKSPACE ACCESS</span></a><p class="v-eyebrow">INVITATION</p><h1>Join your workspace</h1><p class="v-sub" id="inviteInfo">Checking your invitation…</p><div id="inviteError" hidden></div><button class="v-btn primary" id="sendCode" disabled>Send verification code</button><form id="acceptForm" class="v-hidden" style="margin-top:20px"><div class="v-field"><label class="v-label">Six-digit email code</label><input class="v-input" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><div class="v-field v-hidden" id="usernameField"><label class="v-label">Username</label><input class="v-input" name="username" minlength="3" maxlength="40"></div><div class="v-field"><label class="v-label">Create password</label><input class="v-input" name="password" type="password" minlength="14" required autocomplete="new-password"></div><button class="v-btn primary">Accept invitation</button></form></section></main><script src="/js/v04.js"></script><script src="/js/accept-invite.js"></script></body></html>
