name: OIDC provider checks

on:
  pull_request:
    branches: [main]
    paths:
      - "functions/**"
      - "migrations/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/oidc-provider.yml"
  push:
    branches: ["feat/operava-oidc-idp"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Run JelHR backend and OIDC tests
        run: npm test
      - name: Run UI checks
        run: npm run test:ui
